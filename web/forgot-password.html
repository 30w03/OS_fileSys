<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <style>
        :root {
            --primary-color: #18c6b0;
            --secondary-color: #3a6e6b;
            --success-color: #1cc88a;
            --danger-color: #e74a3b;
            --warning-color: #f6c23e;
            --light-color: #f8f9fc;
            --dark-color: #343a40;
            --shadow: 0 0.15rem 1.75rem 0 rgba(24, 198, 176, 0.15);
            --error-bg: #e8fcf8;
        }

        body {
            min-height: 100vh;
            background:
                url('../img/library-869061_1920.jpg') no-repeat center center/cover,
                linear-gradient(135deg, rgba(111, 231, 221, 0.7) 0%, rgba(24, 198, 176, 0.7) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 40px 32px 32px 32px;
        }

        h2 {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
            color: var(--dark-color);
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d3e2;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(to right, #18c6b0, #43e97b);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 13px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 8px rgba(24, 198, 176, 0.18);
            transition: box-shadow 0.2s;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(24, 198, 176, 0.28);
        }

        .links {
            margin-top: 22px;
            text-align: center;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 10px;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.98em;
            margin-top: 4px;
            min-height: 20px;
        }

        .success-message {
            color: var(--success-color);
            font-size: 1em;
            margin-top: 4px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>找回密码</h2>
        <form id="forgotForm">
            <div class="form-group" id="userGroup">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                <div class="error-message" id="userError"></div>
            </div>
            <div class="form-group" id="questionGroup" style="display:none;">
                <label id="securityQuestionLabel"></label>
                <input type="text" id="securityAnswer" placeholder="请输入安全问题答案">
                <div class="error-message" id="answerError"></div>
            </div>
            <div class="form-group" id="resetGroup" style="display:none;">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="请输入新密码">
                <div class="error-message" id="resetError"></div>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">下一步</button>
        </form>
        <div class="links">
            <a href="login.html">返回登录</a>
            <a href="register.html">注册新账户</a>
        </div>
    </div>
    <script>
        let userNo = null;
        let step = 1; // 1: 输入用户名, 2: 答安全问题, 3: 重置密码

        const forgotForm = document.getElementById('forgotForm');
        const usernameInput = document.getElementById('username');
        const userError = document.getElementById('userError');
        const questionGroup = document.getElementById('questionGroup');
        const securityQuestionLabel = document.getElementById('securityQuestionLabel');
        const securityAnswerInput = document.getElementById('securityAnswer');
        const answerError = document.getElementById('answerError');
        const resetGroup = document.getElementById('resetGroup');
        const newPasswordInput = document.getElementById('newPassword');
        const resetError = document.getElementById('resetError');
        const submitBtn = document.getElementById('submitBtn');

        
        forgotForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (step === 1) {
                // 获取安全问题
                const username = usernameInput.value.trim();
                userError.textContent = '';
                if (!username) {
                    userError.textContent = '请输入用户名';
                    return;
                }
                submitBtn.disabled = true;
                fetch('/api/auth/get_security_question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: username })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.security_question && data.user_no) {
                        userNo = data.user_no;
                        securityQuestionLabel.textContent = data.security_question;
                        questionGroup.style.display = '';
                        usernameInput.disabled = true;
                        step = 2;
                        submitBtn.textContent = '验证答案';
                    } else {
                        userError.textContent = data.error || '用户不存在';
                    }
                })
                .catch(() => {
                    userError.textContent = '网络错误，请稍后重试';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                });
            } else if (step === 2) {
                // 校验安全答案
                const answer = securityAnswerInput.value.trim();
                answerError.textContent = '';
                if (!answer) {
                    answerError.textContent = '请输入安全问题答案';
                    return;
                }
                submitBtn.disabled = true;
                fetch('/api/auth/check_security_answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_no: userNo, security_answer: answer })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.msg) {
                        questionGroup.style.display = 'none';
                        resetGroup.style.display = '';
                        step = 3;
                        submitBtn.textContent = '重置密码';
                    } else {
                        answerError.textContent = data.error || '安全答案错误';
                    }
                })
                .catch(() => {
                    answerError.textContent = '网络错误，请稍后重试';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                });
            } else if (step === 3) {
                
                const newpwd = newPasswordInput.value.trim();
                resetError.textContent = '';
                if (!newpwd || newpwd.length < 6) {
                    resetError.textContent = '新密码不能少于6位';
                    return;
                }
                submitBtn.disabled = true;
                fetch(`/users/${encodeURIComponent(userNo)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: newpwd })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.msg) {
                        alert('密码重置成功，请使用新密码登录！');
                        window.location.href = 'login.html';
                    } else {
                        resetError.textContent = data.error || '密码重置失败';
                    }
                })
                .catch(() => {
                    resetError.textContent = '网络错误，请稍后重试';
                })
                .finally(() => {
                    submitBtn.disabled = false;
                });
            }
        });
    </script>
</body>

</html>
