<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>摄像头测试 & E 方向检测</title>
  <style>
    :root {
      --primary-green: #18c6b0;
      --light-green: #43e97b;
      --accent-color: #ff7043;
      --light-bg: #f8f9fc;
      --dark-text: #333;
      --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Microsoft YaHei',sans-serif; }
    body { display:flex; min-height:100vh; background:var(--light-bg); color:var(--dark-text); }
    /* 侧边栏 */
    .sidebar {
      width: 240px; background: linear-gradient(to bottom, #1da598, #43e97b);
      color:#fff; padding:30px 0; display:flex; flex-direction:column;
    }
    .logo-container {
      padding:0 30px 25px; border-bottom:1px solid rgba(255,255,255,0.1);
      display:flex; align-items:center; margin-bottom:25px;
    }
    .logo-container i { font-size:32px; margin-right:15px; color:#ffd54f; }
    .logo-container h1 { font-size:20px; font-weight:700; }
    .nav-item {
      display:flex; align-items:center; padding:15px 30px; font-size:16px;
      text-decoration:none; color:#fff; transition:all .3s; cursor:pointer;
    }
    .nav-item i { width:24px; margin-right:12px; }
    .nav-item:hover { background:rgba(255,255,255,0.1); padding-left:35px; }
    /* 主区 */
    .main-content { flex:1; display:flex; flex-direction:column; }
    .topbar {
      display:flex; justify-content:space-between; align-items:center;
      padding:20px 40px; background:#fff; box-shadow:var(--shadow-light);
      position:sticky; top:0; z-index:10;
    }
    .topbar-logo i { font-size:36px; color:var(--primary-green); }
    .content-area {
      flex:1; padding:40px; background:linear-gradient(to bottom, #eef9f8, #f8f9fc);
      display:flex; flex-direction:column; align-items:center;
    }
    /* 视频与结果 */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 450px;
      margin-bottom: 20px;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.2em;
    }
    #videoStream {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; /* 新增初始隐藏状态 */
    }
    #direction {
      margin: 20px 0;
      font-size: 1.5em;
      font-weight: bold;
      color: var(--accent-color);
      padding: 10px 20px;
      background-color: rgba(255,255,255,0.8);
      border-radius: 20px;
    }
    .button-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    button {
      font-size: 1.1em;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: var(--primary-green);
      color: #fff;
      transition: all .3s;
      box-shadow: var(--shadow-light);
    }
    button:hover { 
      background: var(--light-green);
      transform: translateY(-2px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .status-message {
      margin-top: 15px;
      color: #666;
      font-size: 0.9em;
    }
    /* 加载动画 */
    .loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-green);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="logo-container">
      <i class="fas fa-video"></i>
      <h1>摄像头测试</h1>
    </div>
    <a class="nav-item" href="../nomarlPage.html"><i class="fas fa-arrow-left"></i> 返回主页面</a>
  </nav>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-logo"><i class="fas fa-graduation-cap"></i></div>
      <div class="user-greeting">实时 E 方向检测</div>
    </header>
    <section class="content-area">
      <div class="video-container">
        <img id="videoStream" style="width: 100%; height: 100%; object-fit: contain; display: none;" />
        
        <div class="video-placeholder" id="videoPlaceholder">
          <div>
            <i class="fas fa-video-slash" style="font-size: 3em; margin-bottom: 15px;"></i>
            <p>等待视频流连接...</p>
          </div>
        </div>
        <div class="loader" id="loader"></div>
      </div>

      <div id="direction">当前方向：<span id="dirText">未开始</span></div>
      
      <div class="button-container">
        <button id="startBtn">开始检测</button>
        <button id="stopBtn" disabled>停止检测</button>
        <button id="resetBtn" disabled>重置检测</button>
      </div>
      
      <div id="statusMessage" class="status-message">准备就绪</div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const videoPlaceholder = document.getElementById('videoPlaceholder');
      const videoStream = document.getElementById('videoStream');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const dirText = document.getElementById('dirText');
      const statusMessage = document.getElementById('statusMessage');
      const loader = document.getElementById('loader');
      const resetBtn = document.getElementById('resetBtn');
      
      let statusInterval = null;

      // 点击开始按钮
      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        stopBtn.disabled = true; // 暂时禁用停止按钮，直到确认启动成功
        resetBtn.disabled = true;
        loader.style.display = 'block';
        statusMessage.textContent = '正在启动检测服务...';
        
        try {
          const response = await fetch('/e-detection/start', { method: 'POST' });
          const data = await response.json();

          if (data.status === 'success') {
            statusMessage.textContent = '检测服务已启动';
            dirText.textContent = '初始化中...';
            stopBtn.disabled = false;
            resetBtn.disabled = false;
            
            // *** 这是关键的修改 ***
            // 只设置一次视频流的 src
            setupVideoStream(); 
            
            // 启动状态轮询
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(checkStatus, 1000);
          } else {
            throw new Error(data.message || '启动失败');
          }
        } catch (error) {
          statusMessage.textContent = `启动失败: ${error.message}`;
          startBtn.disabled = false;
        } finally {
          loader.style.display = 'none';
        }
      });

      // 点击停止按钮
      stopBtn.addEventListener('click', async () => {
        stopBtn.disabled = true;
        resetBtn.disabled = true;
        loader.style.display = 'block';
        statusMessage.textContent = '正在停止检测...';
        try {
          const response = await fetch('/e-detection/stop', { method: 'POST' });
          const data = await response.json();
          if (data.status === 'success') {
            statusMessage.textContent = '检测已停止';
            dirText.textContent = '未检测';
          } else {
            statusMessage.textContent = data.message || '停止失败';
          }
        } catch (error) {
          statusMessage.textContent = `停止失败: ${error.message}`;
        } finally {
          // 停止状态轮询
          if (statusInterval) clearInterval(statusInterval);
          // 清空视频流
          videoStream.src = '';
          videoStream.style.display = 'none';
          videoPlaceholder.style.display = 'flex';
          startBtn.disabled = false;
          stopBtn.disabled = true;
          resetBtn.disabled = true;
          loader.style.display = 'none';
        }
      });
      // 新增：点击重置按钮
      resetBtn.addEventListener('click', async () => {
        resetBtn.disabled = true;
        loader.style.display = 'block';
        statusMessage.textContent = '正在重置检测...';
        try {
          // 先停止
          await fetch('/e-detection/stop', { method: 'POST' });
          // 再启动
          const response = await fetch('/e-detection/start', { method: 'POST' });
          const data = await response.json();
          if (data.status === 'success') {
            statusMessage.textContent = '检测已重置并重新启动';
            dirText.textContent = '初始化中...';
            stopBtn.disabled = false;
            // 启动状态轮询
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(checkStatus, 1000);
          } else {
            statusMessage.textContent = data.message || '重置失败';
          }
        } catch (error) {
          statusMessage.textContent = `重置失败: ${error.message}`;
        } finally {
          loader.style.display = 'none';
          resetBtn.disabled = false;
        }
      });

      // 轮询获取后端检测状态
      function checkStatus() {
        fetch('/e-detection/status')
          .then(res => res.json())
          .then(data => {
            if (data.system.detection_running) {
              resetBtn.disabled = false;
              // 只在后端输出Confirmed: ...时才显示结果，否则显示“检测中”
              const dir = data.detection.current_direction;
              if (dir && dir.startsWith('Confirmed:')) {
                // 兼容后端输出格式“Confirmed: xxx (Waiting to continue)”
                let match = dir.match(/Confirmed:\s*([^\s]+)/);
                if (match) {
                  dirText.textContent = match[1];
                } else {
                  dirText.textContent = dir;
                }
              } else {
                dirText.textContent = '检测中...';
              }
            } else {
              resetBtn.disabled = true;
              dirText.textContent = '未检测';
              statusMessage.textContent = '检测已停止或异常';
              if (statusInterval) clearInterval(statusInterval);
            }
          })
          .catch(() => {
            statusMessage.textContent = '状态查询失败';
            if (statusInterval) clearInterval(statusInterval);
          });
      }

      // *** 修改后的函数 ***
      // 设置视频流的 src，并且只调用一次
      function setupVideoStream() {
        videoPlaceholder.style.display = 'none';
        videoStream.style.display = 'block';
        // 只需设置一次，浏览器会自动处理后续的帧
        videoStream.src = '/e-detection/video_feed';
      }
    });
  </script>
  <!-- Font Awesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
</body>
</html>
