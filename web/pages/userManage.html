<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - 同行评审系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* 复用基础样式 */
        body { background-color: #f5f8fa; display: flex; min-height: 100vh; color: #333; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 280px; background: linear-gradient(to bottom, #1da598, #43e97b); color: white; padding: 30px 0; display: flex; flex-direction: column; }
        .logo-container { padding: 0 30px 25px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; margin-bottom: 25px; }
        .logo-container i { font-size: 32px; margin-right: 15px; color: #ffd54f; }
        .logo-container h1 { font-size: 24px; font-weight: 700; }
        .nav-item { display: flex; align-items: center; padding: 18px 30px; font-size: 18px; text-decoration: none; color: #fff; transition: all 0.3s ease; }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 35px; }
        
        /* 主内容区 */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 28px; color: #2c3e50; margin: 0; }
        
        /* 表格样式 */
        .user-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .user-table th, .user-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .user-table th { background: #f8f9fa; font-weight: 600; color: #2c3e50; }
        .user-table tr:hover { background-color: #f8f9fa; }
        
        .role-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .role-author { background: #e3f2fd; color: #2196f3; }
        .role-reviewer { background: #fff3e0; color: #ff9800; }
        .role-editor { background: #e8f5e9; color: #4caf50; }
        .role-admin { background: #fce4ec; color: #e91e63; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s; margin-right: 5px; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #e74a3b; color: white; }
        
        /* 模态框 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 500px; max-width: 90%; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-container">
            <i class="fas fa-book-reader"></i>
            <h1>同行评审</h1>
        </div>
        <a class="nav-item" href="../nomarlPage.html"><i class="fas fa-home"></i> 返回主页</a>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">用户管理</h1>
            <button class="btn btn-edit" onclick="openAddUserModal()" style="padding: 10px 20px; font-size: 16px;">
                <i class="fas fa-plus"></i> 添加用户
            </button>
        </div>

        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr><td colspan="5" style="text-align:center; padding: 30px;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 添加/编辑用户模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">添加用户</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="form-control" id="password" placeholder="留空则不修改">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select class="form-control" id="role" required>
                        <option value="AUTHOR">作者</option>
                        <option value="REVIEWER">评审员</option>
                        <option value="EDITOR">编辑</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                </div>
                <div style="text-align: right;">
                    <button type="button" class="btn" onclick="closeModal()" style="background:#ccc;">取消</button>
                    <button type="submit" class="btn btn-edit">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsers);

        async function loadUsers() {
            try {
                const sessionId = sessionStorage.getItem('sessionId');
                const res = await fetch('/api/users', {
                    headers: { 'Authorization': 'Bearer ' + sessionId }
                });
                const data = await res.json();
                const tbody = document.getElementById('userList');
                
                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">${data.message}</td></tr>`;
                    return;
                }

                // 假设 data.data.users 是 JSON 字符串或对象数组
                let users = [];
                if (typeof data.data.users === 'string') {
                    users = JSON.parse(data.data.users);
                } else {
                    users = data.data.users || [];
                }

                tbody.innerHTML = users.map(user => {
                    const roleClass = 'role-' + user.role.toLowerCase();
                    return `
                        <tr>
                            <td>${user.userId}</td>
                            <td>${user.username}</td>
                            <td><span class="role-badge ${roleClass}">${user.role}</span></td>
                            <td><span style="color: #2ecc71;">Active</span></td>
                            <td>
                                <button class="btn btn-edit" onclick="editUser(${user.userId}, '${user.username}', '${user.role}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-delete" onclick="deleteUser(${user.userId})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function openAddUserModal() {
            document.getElementById('modalTitle').textContent = '添加用户';
            document.getElementById('userId').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('role').value = 'AUTHOR';
            document.getElementById('userModal').style.display = 'flex';
        }

        function editUser(id, name, role) {
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('userId').value = id;
            document.getElementById('username').value = name;
            document.getElementById('password').value = ''; // 编辑时不显示密码
            document.getElementById('role').value = role;
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const sessionId = sessionStorage.getItem('sessionId');
            
            try {
                if (userId) {
                    // 编辑模式：目前只支持修改角色
                    // 如果需要修改密码，需要后端支持
                    const res = await fetch(`/api/users/${userId}/role`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + sessionId
                        },
                        body: JSON.stringify({ role: role })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('用户更新成功');
                        closeModal();
                        loadUsers();
                    } else {
                        alert('更新失败: ' + data.message);
                    }
                } else {
                    // 添加模式：注册新用户
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            username: username, 
                            password: password, 
                            role: role 
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('用户添加成功');
                        closeModal();
                        loadUsers();
                    } else {
                        alert('添加失败: ' + data.message);
                    }
                }
            } catch (err) {
                console.error(err);
                alert('网络错误');
            }
        });

        async function deleteUser(id) {
            if (confirm('确定要彻底删除该用户吗？此操作不可恢复！')) {
                const sessionId = sessionStorage.getItem('sessionId');
                try {
                    const res = await fetch(`/api/users/${id}/deactivate`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': 'Bearer ' + sessionId
                        }
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('用户已删除');
                        loadUsers();
                    } else {
                        alert('操作失败: ' + data.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('网络错误');
                }
            }
        }
    </script>
</body>
</html>
